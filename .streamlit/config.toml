[server]
maxUploadSize = 50
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#4CAF50"                # accent green for buttons, highlights
backgroundColor = "#121212"             # deep dark background
secondaryBackgroundColor = "#1E1E1E"    # card/sidebar panels
textColor = "#E0E0E0"                   # light grey text for readability

[browser]
gatherUsageStats = false
